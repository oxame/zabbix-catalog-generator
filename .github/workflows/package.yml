name: Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/package.yml"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build source and wheel packages
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zabbix-catalog-generator-dist
          path: dist/*
          if-no-files-found: error

  windows-smoke-test:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: zabbix-catalog-generator-dist
          path: dist

      - name: Install wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
          if (-not $wheel) { throw "Wheel package not found" }
          py -m pip install $wheel.FullName

      - name: Test installed command
        shell: pwsh
        run: |
          zabbix-catalog --version
          zabbix-catalog --help
